<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | SilentRaise</title>

    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <div class="container">

        <h1>🎓 Student Login</h1>

        <input type="text" id="name" placeholder="Enter Full Name">

        <input type="text" id="roll" placeholder="Enter Roll Number">

        <input type="email" id="email" placeholder="Enter College Email">

        <input type="password" id="password" placeholder="Enter Password">

        <button id="loginBtn">Login</button>

        <p>Don't have an account?</p>

        <button class="register-btn" onclick="window.location.href='studentSignup.html'">
            Register
        </button>

        <button class="back-btn" onclick="window.location.href='index.html'">
            ⬅ Back
        </button>

    </div>

    <!-- Firebase -->
    <script type="module" src="js/firebase.js"></script>

    <!-- Login Logic -->
    <script type="module" src="js/login.js"></script>

</body>
</html>
